[project]
name = "excel-workspace-backend"
version = "0.1.0"
description = "Independent Excel asset and version management service."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "python-multipart>=0.0.17,<1.0.0",
  "openpyxl>=3.1.0,<4.0.0",
  "xlrd>=2.0.1,<3.0.0",
  "httpx2>=2.0.0,<3.0.0",
  "langgraph>=0.2.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "ruff>=0.8.0,<1.0.0",
  "xlwt>=1.3.0,<2.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
