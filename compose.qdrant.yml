services:
  qdrant:
    image: qdrant/qdrant:v1.18.3-unprivileged
    init: true
    read_only: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
      QDRANT_INIT_FILE_PATH: /qdrant/storage/.qdrant-initialized
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  qdrant_storage:
    name: excel_workspace_qdrant_storage
